name: Free Video Factory
on:
  push:
    branches: [video-factory-free]
    paths:
      - 'video_factory/**'
      - '.github/workflows/video-factory.yml'
  workflow_dispatch:
    inputs:
      publish_telegram:
        description: 'Publish to Telegram after render (requires secrets)'
        type: boolean
        default: false
      publish_vk:
        description: 'Upload video to VK community (requires VK_ACCESS_TOKEN)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - name: Install neural voice client
        run: python -m pip install --user 'edge-tts>=7,<8'
      - name: Render and optionally publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH: ${{ inputs.publish_telegram }}
          REQUIRE_NEURAL_VOICE: ${{ (inputs.publish_telegram || inputs.publish_vk) && 'true' || 'false' }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python -m py_compile video_factory/factory.py && python video_factory/factory.py --scenario salary --out video_factory/out/video.mp4 --publish-telegram
          else
            python -m py_compile video_factory/factory.py && python video_factory/factory.py --scenario salary --out video_factory/out/video.mp4
          fi
      - name: Validate rendered video
        run: |
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 video_factory/out/video.mp4
          test -s video_factory/out/metadata.json
          python -c 'import json; d=json.load(open("video_factory/out/metadata.json")); assert d["voice_engine"] in ("neural", "offline", "external"), d'
          ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=noprint_wrappers=1 video_factory/out/video.mp4
          test -s video_factory/out/narration.mp3 || test -s video_factory/out/narration.wav
      - name: Upload to VK community (explicit opt-in only)
        if: ${{ inputs.publish_vk }}
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: '242557906'
        run: |
          if [ -z "$VK_ACCESS_TOKEN" ]; then
            echo 'Missing VK_ACCESS_TOKEN GitHub Actions secret' >&2
            exit 1
          fi
          python video_factory/vk_upload.py video_factory/out/video.mp4 "Подарочный переполох" "Личные финансы: бюджет, экономия и защита от переплат"
      - uses: actions/upload-artifact@v4
        with:
          name: free-video
          path: |
            video_factory/out/video.mp4
            video_factory/out/metadata.json
