name: Free Video Factory
on:
  workflow_dispatch:
    inputs:
      publish_telegram:
        description: 'Publish to Telegram after render (requires secrets)'
        type: boolean
        default: false
  # No automatic schedule until voice, music, persistence and accounts are ready.
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render and optionally publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH: ${{ inputs.publish_telegram }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python video_factory/factory.py --out video_factory/out/video.mp4 --publish-telegram
          else
            python video_factory/factory.py --out video_factory/out/video.mp4
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: free-video
          path: video_factory/out/video.mp4
