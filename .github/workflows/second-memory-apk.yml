name: Build Second Memory APK
on:
  workflow_dispatch:
  push:
    branches: [vtoraya-pamyat]
    paths:
      - 'second-memory/**'
      - '.github/workflows/second-memory-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned local inference engine
        run: |
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init
          git -C vendor/llama.cpp fetch --depth 1 https://github.com/ggml-org/llama.cpp.git 74d4f5b041ad837153b0e90fc864b8290e01d8d5
          git -C vendor/llama.cpp checkout FETCH_HEAD
      - name: Bundle offline speech and speaker models
        run: python3 scripts/prepare_models.py
      - name: Test and build debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: second-memory-debug-apk
          path: second-memory/app/build/outputs/apk/debug/*.apk

  model-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second-memory
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned engine
        run: |
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init
          git -C vendor/llama.cpp fetch --depth 1 https://github.com/ggml-org/llama.cpp.git 74d4f5b041ad837153b0e90fc864b8290e01d8d5
          git -C vendor/llama.cpp checkout FETCH_HEAD
      - name: Build and test real offline inference
        run: |
          cmake -S app/src/main/cpp -B native-test -DCMAKE_BUILD_TYPE=Release
          cmake --build native-test -j 2
          python3 scripts/test_local_model.py

  android-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: second-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare engine and speech fixture
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init
          git -C vendor/llama.cpp fetch --depth 1 https://github.com/ggml-org/llama.cpp.git 74d4f5b041ad837153b0e90fc864b8290e01d8d5
          git -C vendor/llama.cpp checkout FETCH_HEAD
          python3 scripts/prepare_models.py
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          mkdir -p app/src/androidTest/assets
          espeak-ng -v ru -s 130 -w /tmp/speech.wav "Нужно отправить документы завтра. Напомни позвонить в больницу. Проверка связи."
          ffmpeg -y -i /tmp/speech.wav -ar 16000 -ac 1 -f s16le app/src/androidTest/assets/test-speech.pcm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: second-memory
          script: gradle --no-daemon -PtestAbi=x86_64 connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results
          path: second-memory/app/build/reports/androidTests/
